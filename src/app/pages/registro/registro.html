<div class="container mt-4">
    <div class="card p-4 shadow">
      <h2 class="text-center text-borgona mb-4">Registro en SIIMEX</h2>

      <form id="registerForm" novalidate>
        <!-- Nombre y Apellido Paterno -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/user.png" alt="Nombre" style="width:20px; height:20px;">
              </span>
              <input type="text" class="form-control input-custom" id="nombre" required>
              <div class="invalid-feedback">Introduce tu nombre.</div>
            </div>
          </div>
          <div class="col-md-6">
            <label for="apellido_paterno" class="form-label">Apellido Paterno</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/user.png" alt="Apellido" style="width:20px; height:20px;">
              </span>
              <input type="text" class="form-control input-custom" id="apellido_paterno" required>
              <div class="invalid-feedback">Introduce tu apellido paterno.</div>
            </div>
          </div>
        </div>

        <!-- Apellido Materno y Fecha de Nacimiento -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="apellido_materno" class="form-label">Apellido Materno</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/user.png" alt="Apellido" style="width:20px; height:20px;">
              </span>
              <input type="text" class="form-control input-custom" id="apellido_materno">
            </div>
          </div>
          <div class="col-md-6">
            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/calendario.png" alt="Fecha" style="width:20px; height:20px;">
              </span>
              <input type="date" class="form-control input-custom" id="fecha_nacimiento">
            </div>
          </div>
        </div>

        <!-- Correo y Teléfono -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/correo.png" alt="Correo" style="width:20px; height:20px;">
              </span>
              <input type="email" class="form-control input-custom" id="correo" required>
              <div class="invalid-feedback">Introduce un correo válido.</div>
            </div>
          </div>
          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/telefono.png" alt="Teléfono" style="width:20px; height:20px;">
              </span>
              <input type="text" class="form-control input-custom" id="telefono">
            </div>
          </div>
        </div>

        <!-- Usuario y Contraseña -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="nombre_usuario" class="form-label">CURP</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/user.png" alt="Usuario" style="width:20px; height:20px;">
              </span>
              <input type="text" class="form-control input-custom" id="nombre_usuario" required>
              <div class="invalid-feedback">Elige un nombre de usuario.</div>
            </div>
          </div>
          <div class="col-md-6">
            <label for="contrasena" class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/pass.png" alt="Contraseña" style="width:20px; height:20px;">
              </span>
              <input type="password" class="form-control input-custom" id="contrasena" required minlength="8">
              <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
            </div>
          </div>
        </div>

        <!-- Género -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="genero" class="form-label">Género</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-borgona">
                <img src="../../../assets/img/genero.png" alt="Género" style="width:20px; height:20px;">
              </span>
              <select class="form-select input-custom" id="genero">
                <option value="">Selecciona</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Botón de registro -->
        <div class="d-grid mt-4">
          <a href="/registro-step2" target="_blank" class="btn btn-register mt-3">REGISTRARSE</a>
        </div>

        <div id="regMessage" class="pub-inline-feedback mt-3" role="status" aria-live="polite" style="display:none;"></div>
      </form>
    </div>
  </div>
